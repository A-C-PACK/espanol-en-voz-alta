<title>Español en Voz Alta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bungee&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm reading column, rows instead of boxes, one accent colour; the painted scene board is the only loud element */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#1B2236; --muted:#5B6376; --line:#E2E5EB;
  --blue:#2A56A8; --blue-soft:#E9EEF8; --mark:#FBEFD3; --mark-ink:#8A5A00; --ok:#2E7D4F; --warn:#B3352B;
  --board:#14291F; --board-ink:#F5EFDF; --board-accent:#F2B33D; --board-red:#F08A70;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161F; --surface:#182030; --ink:#E4E8EF; --muted:#A3ABBB; --line:#283245;
  --blue:#9DB8F0; --blue-soft:#1E2A42; --mark:#3A2F14; --mark-ink:#F2C46A; --ok:#72C996; --warn:#EE8A7E;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11161F; --surface:#182030; --ink:#E4E8EF; --muted:#A3ABBB; --line:#283245;
  --blue:#9DB8F0; --blue-soft:#1E2A42; --mark:#3A2F14; --mark-ink:#F2C46A; --ok:#72C996; --warn:#EE8A7E;
  color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6}
.wrap{max-width:740px;margin:0 auto;padding-inline:20px;padding-block:32px 96px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0;font-weight:700}
p{margin:.4rem 0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
a{color:var(--blue)}

/* ---------- hub ---------- */
.hub-h{display:grid;gap:.8rem}
.hub-h h1{font-size:clamp(2.2rem,8vw,3rem);letter-spacing:-.01em}
.hub-h .lede{color:var(--muted);max-width:58ch}
.cycle{display:flex;flex-wrap:wrap;gap:.35rem .5rem;align-items:center;font-size:.88rem;margin-top:.4rem}
.cycle span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:.2rem .7rem;font-weight:700}
.cycle i{color:var(--muted);font-style:normal}
.level{margin-top:3rem}
.level-h{display:flex;align-items:baseline;gap:.7rem;margin-bottom:.6rem}
.level-h h2{font-size:1.4rem}
.level-h .muted{font-size:.9rem}
.lrow{display:grid;grid-template-columns:2.6rem 1fr auto;gap:.3rem .9rem;align-items:center;padding:.85rem .3rem;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.lrows{border-top:1px solid var(--line)}
a.lrow:hover .lt{color:var(--blue)}
.lrow .num{font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;font-size:1.05rem}
.lrow .lt{font-weight:700}
.lrow .lc{font-size:.92rem;color:var(--muted);display:block}
.lrow .lp{font-size:.8rem;color:var(--muted);display:block}
.lrow.soon .num,.lrow.soon .lt{color:var(--muted)}
.lrow.soon .lt{font-weight:400}
.pill{font-size:.75rem;font-weight:700;padding:.2rem .65rem;border-radius:99px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pill.prog{background:var(--mark);color:var(--mark-ink);border-color:transparent}
.pill.done{background:var(--ok);color:var(--surface);border-color:transparent}
@media (max-width:560px){.lrow{grid-template-columns:2.2rem 1fr}.lrow .pill{grid-column:2;justify-self:start}}

/* ---------- lesson header ---------- */
.back{font-size:.92rem;font-weight:700;text-decoration:none;display:inline-block;margin-bottom:1.2rem}
header.lesson{display:grid;gap:1rem}
header.lesson h1{font-size:clamp(2.1rem,7vw,2.8rem);letter-spacing:-.01em}
.meta{font-size:.92rem;color:var(--muted)}
.cando{font-size:1.15rem;line-height:1.5;padding-left:1rem;border-left:3px solid var(--blue)}
.cando .eyebrow{display:block;margin-bottom:.15rem}
.setup{margin:0 0 1rem;padding-left:1rem;border-left:3px solid var(--line)}
.setup .eyebrow{display:block;margin-bottom:.1rem}

/* sticky stage bar */
nav.stages{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:2rem -20px 0;padding:.55rem 20px;display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none}
nav.stages button{flex:0 0 auto;border:0;background:none;color:var(--muted);font-weight:700;font-size:.9rem;padding:.35rem .75rem;border-radius:99px;white-space:nowrap}
nav.stages button.on{background:var(--ink);color:var(--bg)}
nav.stages .t{font-weight:400;opacity:.7;margin-left:.3rem;font-size:.8rem}
.foldall{margin-left:auto;display:flex;gap:.1rem;flex:0 0 auto;align-items:center}
nav.stages .foldall button{font-size:.8rem;padding:.35rem .5rem}
nav.stages .foldall button:hover{color:var(--blue)}

/* stages */
section.stage{padding-top:3.5rem;scroll-margin-top:3.4rem}
section.stage + section.stage{margin-top:2rem;border-top:1px solid var(--line)}
.stage-h{display:flex;align-items:baseline;gap:.7rem}
.stage-h h2{font-size:1.75rem}
.stage-h .n{color:var(--blue);font-size:1.75rem;font-weight:700;font-variant-numeric:tabular-nums}
.lede{color:var(--muted);margin-top:.5rem;max-width:60ch}

.step{margin-top:2.8rem}
.step-h{display:grid;gap:.1rem;margin-bottom:.9rem}
.step-h h3{font-size:1.25rem}
.step-h .eyebrow{color:var(--blue)}
.step-h p{color:var(--muted);font-size:.95rem;margin:.1rem 0 0}

/* collapsible */
.stage-h,.step-h{position:relative;padding-right:2.8rem;cursor:pointer}
.fold{position:absolute;right:0;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;padding:0}
.fold:hover{border-color:var(--blue);color:var(--blue)}
.fold svg{width:16px;height:16px;transition:transform .2s}
.collapsed > .stage-h .fold svg,.collapsed > .step-h .fold svg{transform:rotate(-90deg)}
.stage.collapsed > :not(.stage-h),.step.collapsed > :not(.step-h),.step.collapsed .step-h p{display:none}
.step.collapsed .step-h{margin-bottom:0}
.step.collapsed{margin-top:1.6rem}

/* scene board */
.board{background:var(--board);color:var(--board-ink);border-radius:12px;padding:1.5rem 1.5rem 1.2rem;box-shadow:inset 0 0 0 6px #0d1d15, inset 0 0 0 8px #3a5444}
.board h4{font-family:var(--display);font-weight:400;color:var(--board-accent);font-size:clamp(1.3rem,5vw,1.8rem);margin:0;text-align:center}
.board .sub{text-align:center;font-size:.85rem;opacity:.8;margin-bottom:1.1rem}
.board .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem 2.2rem}
@media (max-width:560px){.board .cols{grid-template-columns:1fr}}
.board h5{font-family:var(--display);font-weight:400;font-size:.9rem;color:var(--board-red);margin:0 0 .3rem;letter-spacing:.04em}
.board h5:not(:first-child){margin-top:.9rem}
.board ul{list-style:none;margin:0;padding:0}
.board li{display:flex;gap:.4rem;align-items:baseline;font-size:1rem}
.board li .dots{flex:1;border-bottom:2px dotted rgba(245,239,223,.3);transform:translateY(-4px)}
.board li .p{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--board-accent);white-space:nowrap}
.board .note{margin-top:1rem;font-size:.85rem;opacity:.85;text-align:center}
.board .map svg{display:block;width:100%;height:auto;max-width:560px;margin:0 auto}
.map .st{fill:#2C4A3A}.map .bk{fill:#1B3528}.map .park{fill:#2F5B3F}
.map text{fill:#F5EFDF;font-family:var(--body);font-size:11px}
.map .lm{font-weight:700}
.map .sl{font-size:8.5px;letter-spacing:.08em;fill:#BFD6C7}
.map .dot{fill:#F2B33D}.map .you{fill:#F08A70;stroke:#F5EFDF;stroke-width:2}
.map .youl{fill:#F08A70;font-size:9.5px;font-weight:700}
.map .n{stroke:#BFD6C7;stroke-width:2;fill:none}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;margin-bottom:.6rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);padding:.35rem .8rem;font-size:.85rem;font-weight:700}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--surface);padding:.45rem .95rem;border-radius:99px;font-weight:700;font-size:.9rem;display:inline-flex;gap:.4rem;align-items:center;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

.say{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:0;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;padding:0}
.say:hover{background:var(--blue);color:var(--surface)}
.say svg{width:16px;height:16px}

/* rows */
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:center;padding:.65rem .2rem;border-bottom:1px solid var(--line)}
.row.chk{grid-template-columns:auto auto 1fr}
.row .es-t{font-weight:700;display:inline}
.row .en-t{display:block;font-size:.9rem;color:var(--muted)}
.row input{width:20px;height:20px;accent-color:var(--ok);margin:0}
.row.done .es-t{color:var(--ok)}
.vrows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:2rem}
@media (max-width:600px){.vrows{grid-template-columns:1fr}}
.vgroup + .vgroup{margin-top:1.4rem}
.vgroup .eyebrow{margin-bottom:.3rem}
.masked .row{cursor:pointer}
.mask-es .row:not(.peek) .es-t,.mask-en .row:not(.peek) .en-t{color:transparent;background:var(--line);border-radius:4px;user-select:none}

.pat{padding:.7rem 0;border-bottom:1px solid var(--line)}
.pat:first-child{border-top:1px solid var(--line)}
.pat .frame{font-weight:700}
.slot{background:var(--mark);color:var(--mark-ink);padding:0 .35rem;border-radius:4px}
.pat .ex{font-size:.92rem;color:var(--muted)}

.line{grid-template-columns:5.5rem 1fr auto}
.line .who{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.line.c .who{color:var(--blue)}
.line .es-t{font-weight:400}
.line.c .es-t{font-weight:700}
.line.playing{background:var(--mark)}
@media (max-width:480px){.line{grid-template-columns:1fr auto}.line .who{grid-column:1 / -1;margin-bottom:-.5rem}}

.qrow{padding:.8rem .2rem;border-bottom:1px solid var(--line);display:grid;gap:.35rem}
.qrow:first-child{border-top:1px solid var(--line)}
.qrow .ans{display:flex;gap:.6rem;align-items:center;font-weight:700;color:var(--blue)}
.reveal{justify-self:start;border:0;background:none;color:var(--blue);font-weight:700;padding:0;font-size:.92rem;text-decoration:underline;text-underline-offset:3px}

details{border-bottom:1px solid var(--line)}
details:first-of-type{border-top:1px solid var(--line)}
summary{cursor:pointer;padding:.8rem .2rem;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:.8rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-weight:400;font-size:1.3rem;line-height:1}
details[open] summary::after{content:"−"}
summary .count{margin-left:auto}
details .inner{padding:0 0 1rem}
details .inner .rows{border-top:0}
.notes{display:grid;gap:.7rem;font-size:.95rem}
.notes b{display:block}

ol.steps{padding-left:1.3rem;margin:1rem 0}
ol.steps li{margin:.35rem 0}
.prompt{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;margin-top:1rem}
.prompt .bar{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.55rem .7rem .55rem 1rem;border-bottom:1px solid var(--line)}
.prompt .bar span{font-weight:700;font-size:.92rem}
.prompt pre{margin:0;padding:1rem;font-family:var(--mono);font-size:.8rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;color:var(--muted)}
.copied{background:var(--ok)!important;border-color:var(--ok)!important;color:var(--surface)!important}
.saylist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.2rem 2rem;margin-top:.6rem}
@media (max-width:560px){.saylist{grid-template-columns:1fr}}
.saylist div{padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.95rem}
.saylist b{color:var(--blue);margin-right:.4rem}
.tip{margin-top:1.4rem;padding:.9rem 1.1rem;background:var(--blue-soft);border-radius:10px;font-size:.95rem}

.block{margin-top:1.8rem}
.block h3{font-size:1.1rem;margin-bottom:.3rem}
textarea{width:100%;min-height:120px;font:inherit;font-size:.95rem;padding:.8rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical;margin-top:.5rem}
.twists{display:grid;margin-top:1rem;border-top:1px solid var(--line)}
.twist{padding:1rem .2rem;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:.3rem 1rem;align-items:start}
.twist h4{margin:0;font-size:1.02rem}
.twist .lvl{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:.5rem}
.twist .lvl.rec{color:var(--ok)}
.twist p{grid-column:1;margin:0;font-size:.93rem;color:var(--muted)}
.twist .btn{grid-row:1 / span 2;grid-column:2;align-self:center}
.twist pre{display:none}

.sarow{display:grid;grid-template-columns:1fr auto;gap:.8rem;align-items:center;padding:.75rem .2rem;border-bottom:1px solid var(--line)}
.sarow:first-child{border-top:1px solid var(--line)}
@media (max-width:600px){.sarow{grid-template-columns:1fr}}
.rating button[aria-pressed="true"][data-v="0"]{background:var(--warn);color:var(--surface)}
.rating button[aria-pressed="true"][data-v="1"]{background:var(--mark-ink);color:var(--surface)}
.rating button[aria-pressed="true"][data-v="2"]{background:var(--ok);color:var(--surface)}
.finish{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem}
.confirm{margin-top:1rem;padding:.9rem 1.1rem;border:1px solid var(--warn);border-radius:10px}
.next{margin-top:3.5rem;padding-top:1.5rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}

.var-done{display:flex;gap:.6rem;align-items:center;margin-top:1.2rem;font-weight:700;font-size:.95rem}
.var-done input{width:20px;height:20px;accent-color:var(--ok);margin:0}
.step-h .eyebrow .ok{color:var(--ok);margin-left:.4rem}
.vsub{font-size:1.05rem;margin:1.6rem 0 .5rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem 1rem;border-radius:8px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script>
/*__LESSON_DATA__*/
</script>
<script>
(function(){
const LESSONS=window.LESSONS||{};
const IDS=Object.keys(LESSONS).sort();
const UPCOMING=[
 [11,"A2","Make plans with a friend"],[12,"A2","Describe my daily routine and job"],[13,"A2","Buy a bus ticket, ask about schedules"],
 [14,"A2","Talk about last weekend"],[15,"A2","Book a hotel room or check in"],[16,"A2","Shop for clothes"],
 [17,"A2","Describe family, friends, colleagues"],[18,"A2","Invitations and apologies"],
 [19,"A2+","Explain a problem and ask for a fix"],[20,"A2+","Compare two things and say which I prefer"],[21,"A2+","Describe symptoms at a pharmacy"],
 [22,"A2+","Tell a story about a past trip"],[23,"A2+","Talk about plans for the weekend or vacation"],
 [24,"B1","Handle unexpected travel problems"],[25,"B1","Make a complaint"],[26,"B1","Give and justify opinions"],
 [27,"B1","Tell the plot of a movie or book"],[28,"B1","Describe a hope or ambition"],[29,"B1","Keep small talk going"],
 [30,"B1","Ask for and follow detailed instructions"],[31,"B1","Take part in a short interview"],[32,"B1","Talk about my work as a teacher"]
];
const LEVELS=[["A1","Beginner"],["A2","Elementary"],["A2+","Strong elementary"],["B1","Intermediate"]];
const REP={"tú":["Perdón, ¿puedes repetir más despacio?","Sorry, can you repeat that more slowly?"],"usted":["Perdón, ¿me lo puede repetir más despacio?","Sorry, can you repeat that more slowly?"]};
const LBL=["Todavía no","Casi","¡Sí!"];

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=s=>String(s).replace(/<[^>]+>/g,"");
function mkStore(p){return{
  get(k,d){try{const v=localStorage.getItem(p+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(p+k,JSON.stringify(v))}catch(e){}},
  clear(){try{Object.keys(localStorage).filter(k=>k.startsWith(p)).forEach(k=>localStorage.removeItem(k))}catch(e){}}}}
const G=mkStore("spanish-course:");
const LS=id=>mkStore("spanish-l"+id+":");
const app=$("#app");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1800)}

/* ---------- speech ---------- */
let rate=G.get("rate",0.7),voices=[];
function pickVoices(){
  if(!("speechSynthesis" in window))return;
  const rank=v=>/es[-_]MX/i.test(v.lang)?0:/es[-_](US|419)/i.test(v.lang)?1:2;
  voices=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang)).sort((a,b)=>rank(a)-rank(b));
  const vi=$("#voiceinfo");if(vi)vi.textContent=voiceText();
}
function voiceText(){return voices.length?`Voice: ${voices[0].name} (${voices[0].lang}).`:"No Spanish voice found in this browser. Edge and Chrome include good Mexican Spanish voices."}
if("speechSynthesis" in window){pickVoices();speechSynthesis.onvoiceschanged=pickVoices}
function utter(text,vi){const u=new SpeechSynthesisUtterance(text);u.lang="es-MX";u.rate=rate;const v=voices[vi||0]||voices[0];if(v)u.voice=v;return u}
function speak(text){if(!("speechSynthesis" in window)){toast("This browser has no speech voices");return}speechSynthesis.cancel();speechSynthesis.speak(utter(text))}
function stopSpeech(){if("speechSynthesis" in window)speechSynthesis.cancel()}

const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
const CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
const sayBtn=t=>`<button class="say" data-say="${esc(strip(t))}" aria-label="Hear: ${esc(strip(t))}">${SPK}</button>`;
const row=(es,en)=>`${sayBtn(es)}<div style="min-width:0"><span class="es-t">${es}</span><span class="en-t">${en}</span></div>`;

/* ---------- global delegation ---------- */
function flash(btn,label){const o=btn.textContent;btn.textContent=label;btn.classList.add("copied");setTimeout(()=>{btn.textContent=o;btn.classList.remove("copied")},1500)}
function copyText(text,btn){
  if(!navigator.clipboard){toast("Select the text and copy it with Ctrl+C");return}
  navigator.clipboard.writeText(text).then(()=>flash(btn,"Copied"),()=>toast("Select the text and copy it with Ctrl+C"));
}
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-say]");if(s){speak(s.dataset.say);return}
  const c=e.target.closest("[data-copy]");if(c){const el=document.getElementById(c.dataset.copy);if(el)copyText(el.textContent,c);return}
  if(e.target.closest("input,button,a,summary"))return;
  const r=e.target.closest(".masked .row");if(r)r.classList.toggle("peek");
});

/* ---------- progress ---------- */
function progress(L){
  const S=LS(L.id),learned=S.get("learned",{}),ratings=S.get("ratings",{});
  const n=L.core.concat([REP[L.reg]]).filter(([es])=>learned[es]).length;
  const rated=Object.values(ratings),yes=rated.filter(v=>v===2).length,total=L.sa.length+1;

YOUR ROLE
${P.role}

${P.infoTitle}
${P.info}
${P.twist?`
TWIST
${P.twist}
`:""}
HOW TO TALK TO ME
- Speak only Spanish, ${b1?"clearly, at a relaxed natural pace. Use 1 to 3 sentences per turn.":"slowly and clearly. Use 1 or 2 short sentences per turn."}
- ${a1?"Use very simple A1 words and short questions.":b1?"Use natural everyday B1 Spanish, including common Mexican expressions.":"Use everyday A2 words."} Ask one question at a time.
- ${P.lead}
- If I make a mistake, don't stop to explain. Repeat the correct form naturally in your reply. Example: ${P.recast}
- If I'm stuck, or I say "ayuda", give me a short hint: the beginning of a sentence I could say.
- If I say "más despacio" or "otra vez", repeat it more slowly with simpler words.
- If I speak English, answer in simple Spanish and help me say it in Spanish.
- Don't end the scene yourself.

When I say "terminamos", leave the role and speak English. Keep the feedback under one minute:
1. One thing I did well.
2. Up to three corrections, most useful first: what I said, then a better way to say it. Say the Spanish slowly.
3. One new phrase to use next time.
My speech is transcribed automatically and errors may get cleaned up, so mention anything you weren't sure you heard correctly. Then ask if I want to try again.

If you understand, reply only: "Listo. ${reg==="tú"?"Di":"Diga"} 'hola' para empezar."`;
}
function reviewPrompt(L,core,sa){

  return `I'm an ${L.level} Spanish learner (Mexican Spanish). Below is the transcript of a voice role play: ${L.scene}.
CEFR goal: "${L.cando}"

My 8 target phrases: ${core.map(c=>strip(c[0])).join(" · ")}

My speech was transcribed by speech recognition, which often corrects grammar and removes hesitations. Treat my lines as a best-case version of what I actually said.

Please give me:
1. Can-do check. For each, say yes / partly / no with a short quote: ${sa.join(" · ")}.
2. My top 3 corrections or upgrades: what I said → more natural Mexican Spanish → why (one line).
3. Which target phrases I used and which I avoided.
4. Two phrases to focus on in my next attempt.
5. My side of the conversation rewritten at a solid ${next} level, so I can read it aloud.
Keep explanations short and in English.

TRANSCRIPT:
`;
}

  /* collapsible */
  const folds=$$("section.stage, .step",app);
  function setFold(el,c,save=true){
    el.classList.toggle("collapsed",c);
    const b=$(":scope > .stage-h .fold, :scope > .step-h .fold",el);
    if(b){b.setAttribute("aria-expanded",String(!c));b.setAttribute("aria-label",(c?"Expand ":"Collapse ")+b.dataset.name)}
    if(save){collapsed[el.id]=c;S.set("collapsed",collapsed)}
  }
  folds.forEach(el=>{
    const h=$(":scope > .stage-h, :scope > .step-h",el);
    h.insertAdjacentHTML("beforeend",`<button class="fold" data-name="${esc($("h2,h3",h).textContent)}">${CHEV}</button>`);
    h.addEventListener("click",()=>setFold(el,!el.classList.contains("collapsed")));
    setFold(el,el.id in collapsed?!!collapsed[el.id]:el.dataset.closed==="1",false);
  });
  $("#expand-all").onclick=()=>folds.forEach(el=>setFold(el,false));
  $("#collapse-all").onclick=()=>$$("section.stage",app).forEach(el=>setFold(el,true));

  /* reset */
  $("#reset").onclick=()=>{$("#reset-confirm").hidden=false};
  $("#reset-no").onclick=()=>{$("#reset-confirm").hidden=true};
  $("#reset-yes").onclick=()=>{S.clear();learned={};ratings={};collapsed={};varsDone={};notes.value="";renderCore();
    $$("[data-vis]").forEach(g=>setVis(g.dataset.vis,"all",false));folds.forEach(el=>setFold(el,el.dataset.closed==="1",false));
    $$("[data-var]").forEach(c=>{c.checked=false;$("#vok"+c.dataset.var).textContent=""});
    $$(".rating button").forEach(b=>b.setAttribute("aria-pressed","false"));$("#reset-confirm").hidden=true;toast("Lesson reset")};

  /* stage bar */
  const tabs=$$("nav.stages [data-go]");
  tabs.forEach(b=>b.addEventListener("click",()=>{const s=document.getElementById(b.dataset.go);setFold(s,false);s.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}));
  io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting)tabs.forEach(b=>b.classList.toggle("on",b.dataset.go===en.target.id))})},{rootMargin:"-40% 0px -55% 0px"});
  $$("section.stage",app).forEach(s=>io.observe(s));
}

/* ---------- router ---------- */
function route(){
  stopSpeech();
  if(io){io.disconnect();io=null}
  const m=location.hash.match(/^#l(\d\d)$/);
  if(m&&LESSONS[m[1]])renderLesson(LESSONS[m[1]]);else renderHub();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
})();
</script>
